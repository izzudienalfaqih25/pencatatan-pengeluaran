name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build dan Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode dari repository
        uses: actions/checkout@v5

      - name: Pasang Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Pasang dependensi
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Kompilasi (cek sintaks)
        run: python -m compileall -q pengeluaran main.py scripts

      - name: Jalankan unit test
        run: python -m pytest -v

  sast-scan:
    name: SAST Scan dan Quality Gate
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Ambil kode dari repository
        uses: actions/checkout@v5

      - name: Pasang Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Pasang Semgrep
        run: pip install semgrep

      - name: Pindai kode dengan Semgrep
        run: >
          semgrep scan
          --config p/python
          --config .semgrep/rules.yml
          --metrics=off
          --json-output=semgrep-results.json
          .

      - name: Simpan hasil pemindaian
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: semgrep-results
          path: semgrep-results.json
          if-no-files-found: warn

      - name: Quality Gate
        run: python scripts/quality_gate.py semgrep-results.json
